[package]
name = "fillerncut-core"
version = "0.4.2"
edition = "2021"
description = "Pure logic for FillernCut: link parsing, ffmpeg argument building, library + settings storage"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[dev-dependencies]
tempfile = "3"
